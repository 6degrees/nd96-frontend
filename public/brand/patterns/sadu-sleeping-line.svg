      <path d="M10 1.5 18.5 10 10 18.5 1.5 10 10 1.5Z" stroke="#4CB944" stroke-width="1.25" />
      <path d="M10 5 14.5 10 10 15 5.5 10 10 5Z" fill="#0E8A46" />
      <path d="M10 7.5 12.5 10 10 12.5 7.5 10 10 7.5Z" fill="#4CB944" />
      <!-- Variant B — slightly wider outline -->
